<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>The Things We Keep — Jewelry Box 3D</title><style>body{margin:0;background:#17120f;color:#f2dfc5;font:16px system-ui}header,footer{padding:16px;background:#261c17}h1{font:30px Georgia;margin:0 0 6px}#scene{height:65vh;min-height:340px;touch-action:none;position:relative}button{background:#916c3d;color:white;border:1px solid #cda970;border-radius:9px;padding:13px;margin:4px;font-weight:bold}#status{display:inline-block;padding:8px}#error{display:none;padding:18px;color:#ffdbb9;background:#60362d}small{display:block;padding:12px}</style><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.1/examples/jsm/"}}</script></head><body><header><h1>The Things We Keep</h1>Victorian jewelry box · 3D prototype</header><div id="error"></div><div id="scene"></div><footer><button id="lid">Open lid</button><button id="brush">Cleaning brush: Off</button><button id="reset">Reset dust</button><span id="status">Dust remaining: 100%</span></footer><small>Drag to rotate · Pinch to zoom · Turn on brush to remove dust from lid.</small><script type="module">
try{
const THREE=await import('three');const {OrbitControls}=await import('three/addons/controls/OrbitControls.js');
const host=document.querySelector('#scene'),scene=new THREE.Scene();scene.background=new THREE.Color('#17120f');const camera=new THREE.PerspectiveCamera(43,host.clientWidth/host.clientHeight,.1,100);camera.position.set(5,3.5,6);
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(host.clientWidth,host.clientHeight);renderer.shadowMap.enabled=true;host.appendChild(renderer.domElement);
const controls=new OrbitControls(camera,renderer.domElement);controls.target.set(0,.8,0);controls.enableDamping=true;controls.minDistance=3;controls.maxDistance=12;
scene.add(new THREE.HemisphereLight(0xffe9cf,0x33201c,2.4));const light=new THREE.DirectionalLight(0xffd8a4,3);light.position.set(3,7,5);light.castShadow=true;scene.add(light);

const wood=new THREE.MeshStandardMaterial({color:0x53271a,roughness:.36});
const darkWood=new THREE.MeshStandardMaterial({color:0x2a120e,roughness:.45});
const gold=new THREE.MeshStandardMaterial({color:0xb89552,metalness:.78,roughness:.31});
const agedBrass=new THREE.MeshStandardMaterial({color:0x826337,metalness:.72,roughness:.42});
const velvet=new THREE.MeshStandardMaterial({color:0x541a2b,roughness:1});
const black=new THREE.MeshStandardMaterial({color:0x180e0c,roughness:.5});
const grain=document.createElement('canvas');grain.width=512;grain.height=512;
const g=grain.getContext('2d');g.fillStyle='#6c3323';g.fillRect(0,0,512,512);
for(let i=0;i<1700;i++){const x=Math.random()*512,y=Math.random()*512;g.strokeStyle=i%4===0?'rgba(15,4,2,.10)':'rgba(204,115,66,.07)';g.lineWidth=.4+Math.random()*1.5;g.beginPath();g.moveTo(x,y);g.bezierCurveTo(x+2,y+24,x-3,y+64,x+3,y+115);g.stroke()}
const grainTex=new THREE.CanvasTexture(grain);grainTex.colorSpace=THREE.SRGBColorSpace;wood.map=grainTex;wood.color.set(0xffffff);
function block(p,w,h,d,x,y,z,mat){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat);m.position.set(x,y,z);m.castShadow=true;m.receiveShadow=true;p.add(m);return m}
function ball(p,r,x,y,z,mat){const m=new THREE.Mesh(new THREE.SphereGeometry(r,12,8),mat);m.position.set(x,y,z);m.castShadow=true;p.add(m);return m}
function tube(p,pts,r,mat){const path=new THREE.CatmullRomCurve3(pts.map(q=>new THREE.Vector3(...q)));const m=new THREE.Mesh(new THREE.TubeGeometry(path,Math.max(18,pts.length*5),r,6,false),mat);p.add(m);return m}
function trim(p,w,d,y,mat=gold,t=.035){for(const z of [-d/2,d/2])block(p,w,t,t,0,y,z,mat);for(const x of [-w/2,w/2])block(p,t,t,d,x,y,0,mat)}
function leaf(p,x,y,z,angle,s=1){const shape=new THREE.Shape();shape.moveTo(0,0);shape.bezierCurveTo(-.13*s,.09*s,-.15*s,.25*s,0,.39*s);shape.bezierCurveTo(.15*s,.25*s,.13*s,.09*s,0,0);const mesh=new THREE.Mesh(new THREE.ShapeGeometry(shape,10),agedBrass);mesh.rotation.x=-Math.PI/2;mesh.rotation.z=angle;mesh.position.set(x,y,z);p.add(mesh)}
const floor=new THREE.Mesh(new THREE.PlaneGeometry(100,100),new THREE.MeshStandardMaterial({color:0x30241f,roughness:1}));floor.rotation.x=-Math.PI/2;floor.receiveShadow=true;scene.add(floor);
const base=new THREE.Group();scene.add(base);
block(base,3.35,.83,2.25,0,.73,0,wood);
block(base,3.18,.045,2.08,0,1.175,0,darkWood);
block(base,3.03,.018,1.93,0,1.205,0,velvet);
trim(base,3.36,2.26,.34,agedBrass,.027);trim(base,3.36,2.26,1.14,agedBrass,.028);
for(const x of [-1.5,1.5])for(const z of [-.94,.94]){block(base,.23,.2,.23,x,.21,z,darkWood);block(base,.18,.065,.18,x,.12,z,agedBrass)}
// Inset front panels, carved frames and a central escutcheon.
for(const x of [-.92,.92]){block(base,1.34,.57,.012,x,.77,1.132,darkWood);block(base,1.26,.49,.018,x,.77,1.143,wood)}
for(const x of [-1.58,1.58])block(base,.05,.7,.055,x,.76,1.12,agedBrass);
block(base,.37,.37,.055,0,.78,1.167,agedBrass);
block(base,.25,.27,.062,0,.78,1.21,darkWood);
const keyhole=ball(base,.045,0,.81,1.26,gold);keyhole.scale.set(.62,1.3,.2);
tube(base,[[0,.79,1.28],[0,.71,1.28]],.015,gold);
// The lid is built in local coordinates centered at the rear hinge.
const hinge=new THREE.Group();hinge.position.set(0,1.145,-1.125);base.add(hinge);
block(hinge,3.35,.34,2.25,0,.17,1.125,wood);
const lidDetails=new THREE.Group();lidDetails.position.z=1.125;hinge.add(lidDetails);
// Inlaid recessed center, surrounded by stepped molding that stays inside the lid perimeter.
block(lidDetails,2.93,.013,1.83,0,.349,0,darkWood);
block(lidDetails,2.79,.016,1.69,0,.36,0,wood);
trim(lidDetails,3.23,2.13,.351,agedBrass,.025);
trim(lidDetails,2.88,1.78,.375,gold,.023);
trim(lidDetails,2.61,1.51,.382,agedBrass,.012);
// Decorative central oval cartouche, not floating spherical studs.
const oval=new THREE.Mesh(new THREE.TorusGeometry(.38,.032,9,56),gold);
oval.rotation.x=-Math.PI/2;oval.scale.set(1.45,.82,1);oval.position.set(0,.403,0);lidDetails.add(oval);
const center=new THREE.Mesh(new THREE.CircleGeometry(.29,48),agedBrass);center.rotation.x=-Math.PI/2;center.scale.set(1.48,.9,1);center.position.set(0,.396,0);lidDetails.add(center);
for(const x of [-1,1])for(const z of [-.52,.52]){leaf(lidDetails,x*.91,.395,z, x*z>0?.7:-.7,.8);leaf(lidDetails,x*.91,.396,z,x*z>0?2.2:-2.2,.55)}
for(const side of [-1,1]){const pts=[];for(let i=0;i<=24;i++){const a=i/24*Math.PI*1.65;pts.push([side*(.55+.23*Math.cos(a)),.396,.24*Math.sin(a)])}tube(lidDetails,pts,.014,agedBrass)}
// Narrow brass hinge barrels and a velvet underside panel.
for(const x of [-1.14,1.14]){const barrel=new THREE.Mesh(new THREE.CylinderGeometry(.045,.045,.28,12),agedBrass);barrel.rotation.z=Math.PI/2;barrel.position.set(x,.015,0);hinge.add(barrel)}
block(hinge,2.93,.012,1.85,0,-.006,1.125,velvet);
// Compartments are inset inside the body rather than resting above it.
for(const x of [-.76,.76])block(base,1.36,.012,1.76,x,1.236,0,velvet);
block(base,.035,.09,1.78,0,1.25,0,agedBrass);
// Dust remains brushable, but is a translucent aged film so details remain legible.
const canvas=document.createElement('canvas');canvas.width=512;canvas.height=384;
const ctx=canvas.getContext('2d',{willReadFrequently:true}),texture=new THREE.CanvasTexture(canvas);
const dust=new THREE.Mesh(new THREE.PlaneGeometry(2.7,1.59),new THREE.MeshBasicMaterial({map:texture,transparent:true,depthWrite:false,side:THREE.DoubleSide}));
dust.rotation.x=-Math.PI/2;dust.position.set(0,.411,1.125);hinge.add(dust);
function update(){texture.needsUpdate=true;const data=ctx.getImageData(0,0,512,384).data;let dirty=0,total=0;for(let i=3;i<data.length;i+=64){total++;if(data[i]>45)dirty++}document.querySelector('#status').textContent='Dust remaining: '+Math.round(dirty/total*100)+'%'}
function reset(){ctx.clearRect(0,0,512,384);ctx.fillStyle='rgba(117,103,84,.54)';ctx.fillRect(0,0,512,384);for(let i=0;i<1900;i++){ctx.fillStyle='rgba(195,177,145,'+(Math.random()*.4)+')';ctx.beginPath();ctx.arc(Math.random()*512,Math.random()*384,Math.random()*5+1,0,7);ctx.fill()}update()}reset();
let opened=false,brush=false,down=false;document.querySelector('#lid').onclick=()=>{opened=!opened;document.querySelector('#lid').textContent=opened?'Close lid':'Open lid'};document.querySelector('#brush').onclick=()=>{brush=!brush;controls.enabled=!brush;document.querySelector('#brush').textContent='Cleaning brush: '+(brush?'On':'Off')};document.querySelector('#reset').onclick=reset;
const ray=new THREE.Raycaster(),point=new THREE.Vector2();let ticks=0;function clean(e){if(!brush||!down)return;const r=renderer.domElement.getBoundingClientRect();point.set((e.clientX-r.left)/r.width*2-1,-(e.clientY-r.top)/r.height*2+1);ray.setFromCamera(point,camera);const hit=ray.intersectObject(dust)[0];if(!hit?.uv)return;const x=hit.uv.x*512,y=(1-hit.uv.y)*384;ctx.save();ctx.globalCompositeOperation='destination-out';ctx.beginPath();ctx.arc(x,y,33,0,Math.PI*2);ctx.fill();ctx.restore();texture.needsUpdate=true;if(++ticks%3===0)update()}
renderer.domElement.addEventListener('pointerdown',e=>{down=true;if(brush){renderer.domElement.setPointerCapture(e.pointerId);clean(e)}});renderer.domElement.addEventListener('pointermove',clean);renderer.domElement.addEventListener('pointerup',()=>{down=false;if(brush)update()});renderer.domElement.addEventListener('pointercancel',()=>down=false);
function frame(){requestAnimationFrame(frame);hinge.rotation.x+=((opened?-.95:0)-hinge.rotation.x)*.12;controls.update();renderer.render(scene,camera)}frame();new ResizeObserver(()=>{const w=host.clientWidth,h=host.clientHeight;camera.aspect=w/h;camera.updateProjectionMatrix();renderer.setSize(w,h)}).observe(host);
}catch(e){const el=document.querySelector('#error');el.style.display='block';el.textContent='3D renderer failed: '+e.message;console.error(e)}
</script></body></html>
